[tox]
envlist =
  py38
  py39
  py310
  py311
  py312
  py313

[testenv]
deps =
  pipenv==2022.11.30; python_version < "3.12"
  pipenv>=2023.4.29; python_version >= "3.12"

allowlist_externals =
  black
  flake8

commands =
  pipenv sync -d
  flake8
  black --check --diff monkeytype
  isort --check --diff monkeytype
  mypy monkeytype
  pytest
